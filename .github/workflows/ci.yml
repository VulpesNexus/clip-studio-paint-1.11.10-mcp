name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-unit-test:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install hash-locked dependencies
        shell: pwsh
        run: >-
          python -m pip install
          --disable-pip-version-check
          --require-hashes
          --requirement requirements.lock.txt

      - name: Compile Python sources
        shell: pwsh
        run: python -X utf8 -m compileall -q csp_mcp server.py tests

      - name: Parse security-critical PowerShell scripts
        shell: pwsh
        run: |
          $Failures = @()
          foreach ($Script in Get-ChildItem -LiteralPath scripts -Filter '*.ps1') {
            $Tokens = $null
            $Errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $Script.FullName,
              [ref]$Tokens,
              [ref]$Errors
            )
            foreach ($ErrorItem in $Errors) {
              $Failures += "$($Script.Name): $($ErrorItem.Message)"
            }
          }
          if ($Failures.Count -gt 0) {
            throw ($Failures -join [Environment]::NewLine)
          }

      - name: Run unit tests
        shell: pwsh
        run: python -X utf8 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test the PowerShell path-root policy
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\security_acl_roots.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 run failed.' }
          pwsh -NoProfile -File tests\security_acl_roots.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 7 run failed.' }

      - name: Reject whitespace errors in the release commit
        shell: pwsh
        run: git diff-tree --check --root HEAD

      # CSP-dependent stdio smoke and interactive acceptance tests are
      # intentionally excluded: hosted runners do not contain the attested
      # CSP production executable, shortcut settings, desktop, or DPI profile.
