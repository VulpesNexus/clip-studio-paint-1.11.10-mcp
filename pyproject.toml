[project]
name = "clip-studio-paint-1.11.10-mcp"
version = "2.0.0"
description = "Local, CSP-scoped MCP bridge for Clip Studio Paint 1.11.10 on Windows"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "A2pha" },
  { name = "VulpesNexus" },
]
requires-python = ">=3.13,<3.14"
keywords = ["clip-studio-paint", "codex", "mcp", "windows-automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "mcp==1.30.0",
  "Pillow>=13,<14",
  "pywin32==312",
]

[project.urls]
Homepage = "https://github.com/VulpesNexus/clip-studio-paint-1.11.10-mcp"
Documentation = "https://github.com/VulpesNexus/clip-studio-paint-1.11.10-mcp#readme"
Repository = "https://github.com/VulpesNexus/clip-studio-paint-1.11.10-mcp.git"
Issues = "https://github.com/VulpesNexus/clip-studio-paint-1.11.10-mcp/issues"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
