[project]
name = "csp-local-mcp"
version = "1.1.0"
description = "Local, CSP-scoped MCP bridge for CLIP STUDIO PAINT on Windows"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "A2pha" },
]
requires-python = ">=3.13,<3.14"
keywords = ["clip-studio-paint", "codex", "mcp", "windows-automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "mcp==1.29.0",
  "Pillow==12.3.0",
  "pywin32==312",
]

[project.urls]
Homepage = "https://github.com/A2pha/clip-studio-paint-5.1.2-production-mcp"
Documentation = "https://github.com/A2pha/clip-studio-paint-5.1.2-production-mcp#readme"
Repository = "https://github.com/A2pha/clip-studio-paint-5.1.2-production-mcp.git"
Issues = "https://github.com/A2pha/clip-studio-paint-5.1.2-production-mcp/issues"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
